[project]
name = "api"
description = "API pública do Followw UnB"
version = "0.0.1"
authors = [
    { name = "eliabe", email = "74092305+eliabexp@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "sqlalchemy[asyncio]>=2.0.52",
]

[project.scripts]
api = "src:main"
db-init = "src.db.main:db_init"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.format]
line-ending = "lf"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]
