name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [oracle-cloud-deploy]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Testes e lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.1
        with:
          version: "0.13.4"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --locked --all-packages

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -n auto

  web:
    name: Testes e lint (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run build

  oci:
    name: Implantação OCI
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: deploy/oci
        shell: bash
    env:
      CADDYFILE: ./Caddyfile.smoke
      COMPOSE_PROJECT_NAME: followw-preview
      POSTGRES_PASSWORD: smoke-db-admin
      POSTGRES_APP_PASSWORD: smoke-db-app
      JWT_SECRET_KEY: segredo-de-sessao-somente-do-teste
      OAUTH_SECRET_KEY: segredo-de-oauth-exclusivo-do-teste
      RATE_LIMIT_SECRET_KEY: segredo-de-limite-somente-do-teste
      UPSTASH_REDIS_REST_TOKEN: smoke
      RATE_LIMIT_LOGIN_REQUESTS: 3
    steps:
      - uses: actions/checkout@v7
      - run: grep '^QSTASH_' .env.example >> "$GITHUB_ENV"
      - name: Validar os arquivos Compose
        run: |
          docker compose config --format json | jq -e '
            any(.services.caddy.ports[]; .published == "443" and .protocol == "udp")
          '
          docker compose -f compose.coolify.yml config --format json | jq -e '
            (.services | keys == ["api", "db-init", "web"]) and
            .networks.backend.external and
            .networks.backend.name == "followw-preview_default" and
            .services.api.labels["traefik.enable"] == "false" and
            .services.web.labels["traefik.enable"] == "false" and
            .services.api.labels["traefik.http.services.followw-coolify-api.loadbalancer.server.scheme"] == "h2c" and
            .services.web.labels["traefik.http.services.followw-coolify-web.loadbalancer.server.scheme"] == "h2c" and
            (.services.api.labels["traefik.http.middlewares.followw-coolify-api-compress.compress.includedcontenttypes"] | contains("application/json")) and
            (.services.web.labels["traefik.http.middlewares.followw-coolify-web-compress.compress.includedcontenttypes"] | contains("text/html"))
          '
      - name: Subir com HTTPS local
        run: |
          { printf '{\n\tlocal_certs\n}\n\n'; cat Caddyfile.preview; } > Caddyfile.smoke
          docker compose up -d --build
          timeout 30s bash -c '
            until docker compose exec -T caddy cat /data/caddy/pki/authorities/local/root.crt; do
              sleep 1
            done
          ' > "$RUNNER_TEMP/caddy.crt"
      - name: Ler matéria semeada pelo proxy e abrir o frontend
        run: |
          test "$(curl --http2 --fail --silent --show-error --retry 12 --retry-connrefused \
            --cacert "$RUNNER_TEMP/caddy.crt" --resolve oracle.followw.app:443:127.0.0.1 \
            --write-out '%{http_version}' --output "$RUNNER_TEMP/subjects.json" \
            'https://oracle.followw.app/api/public/subjects?code=MAT0025')" = 2
          jq -e 'any(.items[]; .code == "MAT0025")' "$RUNNER_TEMP/subjects.json"
          curl --http2 --fail --silent --show-error --cacert "$RUNNER_TEMP/caddy.crt" \
            --resolve oracle.followw.app:443:127.0.0.1 https://oracle.followw.app/login \
            -D - -o /dev/null | grep -qi '^x-robots-tag: noindex'
          curl --http2 --fail --silent --show-error -H 'Accept-Encoding: gzip' \
            --cacert "$RUNNER_TEMP/caddy.crt" --resolve oracle.followw.app:443:127.0.0.1 \
            https://oracle.followw.app/api/openapi.json -D "$RUNNER_TEMP/openapi.headers" \
            --output "$RUNNER_TEMP/openapi.json.gz"
          grep -qi '^content-encoding: gzip' "$RUNNER_TEMP/openapi.headers"
          gzip -dc "$RUNNER_TEMP/openapi.json.gz" | jq -e '.info.title == "Followw UnB API"'
      - name: Conferir privilégios da conta da API
        run: |
          test "$(docker compose exec -T -e PGPASSWORD="$POSTGRES_APP_PASSWORD" db \
            psql -X -h db -U followw_app -d followw -Atc \
            "SELECT has_schema_privilege(current_user, 'public', 'CREATE'), has_table_privilege(current_user, 'public.subjects', 'INSERT')")" = 'f|t'
      - name: Conferir HTTP/2 nos serviços do Coolify
        run: |
          docker network create coolify
          docker compose -p followw-ci-coolify -f compose.coolify.yml up -d --build --wait

          service_ip() {
            docker inspect --format '{{(index .NetworkSettings.Networks "coolify").IPAddress}}' \
              "$(docker compose -p followw-ci-coolify -f compose.coolify.yml ps -q "$1")"
          }
          api_ip="$(service_ip api)"
          web_ip="$(service_ip web)"
          curl_args=(--http2-prior-knowledge --fail --silent --show-error --retry 10 --retry-connrefused --max-time 8)
          test "$(curl "${curl_args[@]}" -H 'X-Forwarded-Proto: https' --write-out '%{http_version}' \
            --output "$RUNNER_TEMP/subjects-h2.json" "http://$api_ip:8000/public/subjects?code=MAT0025")" = 2
          jq -e 'any(.items[]; .code == "MAT0025")' "$RUNNER_TEMP/subjects-h2.json"
          test "$(curl "${curl_args[@]}" --write-out '%{http_version}' \
            --output "$RUNNER_TEMP/login-h2.html" "http://$web_ip:3000/login")" = 2
          assets=$(grep -oE '/assets/[a-zA-Z0-9_.-]+\.(js|css)' "$RUNNER_TEMP/login-h2.html" | sort -u)
          echo "$assets" | grep -q '\.js$'
          echo "$assets" | grep -q '\.css$'
          compressed=0
          while IFS= read -r asset; do
            format=$(curl "${curl_args[@]}" -H 'Accept-Encoding: br, gzip' \
              -D "$RUNNER_TEMP/asset.headers" --output /dev/null --write-out '%{content_type}' \
              "http://$web_ip:3000$asset")
            case "$asset:$format" in
              *.js:text/javascript*|*.js:application/javascript*|*.css:text/css*) ;;
              *) echo "Tipo de conteúdo inesperado em $asset: $format"; exit 1;;
            esac
            grep -qi '^cache-control:.*immutable' "$RUNNER_TEMP/asset.headers"
            if grep -qi '^content-encoding: \(br\|gzip\|zstd\)' "$RUNNER_TEMP/asset.headers"; then
              compressed=1
            fi
          done <<< "$assets"
          test "$compressed" = 1
          curl "${curl_args[@]}" -D "$RUNNER_TEMP/sw.headers" --output /dev/null "http://$web_ip:3000/sw.js"
          grep -qi '^cache-control:.*no-cache' "$RUNNER_TEMP/sw.headers"
          curl "${curl_args[@]}" --output /dev/null "http://$web_ip:3000/manifest.json"
          curl "${curl_args[@]}" --output /dev/null "http://$web_ip:3000/favicon.svg"
      - name: Confirmar cotas por visitante e entrega pela fila privada
        run: |
          docker compose -p followw-ci-coolify -f compose.coolify.yml exec -T api python - <<'PY'
          import asyncio

          import httpx
          from sigaa_client.models import Credentials

          from api.sync.engine import Job, Step
          from api.sync.queue import QStashQueue

          with httpx.Client(base_url="http://127.0.0.1:8000") as client:
              def status(edge, visitor):
                  return client.post(
                      "/auth/sigaa",
                      json={},
                      headers={
                          "X-Forwarded-Proto": "https",
                          "X-Forwarded-For": edge,
                          "CF-Connecting-IP": visitor,
                      },
                  ).status_code

              edge, visitor = "104.21.58.165", "203.0.113.1"
              assert [status(edge, visitor) for _ in range(4)] == [422, 422, 422, 429]
              assert status(edge, "203.0.113.2") == 422
              assert [status("198.51.100.1", ip) for ip in (
                  "203.0.113.2", "203.0.113.3", "203.0.113.4", "203.0.113.5"
              )] == [422, 422, 422, 429]
              assert client.post(
                  "/jobs", headers={"X-Forwarded-For": edge, "X-Forwarded-Proto": "https"}
              ).status_code == 404

          async def publish():
              queue = QStashQueue()
              try:
                  await queue.enqueue(Job(
                      credentials=Credentials(registration="000000000", password="smoke"),
                      steps=(Step(task="smoke-desconhecida"),),
                  ))
              finally:
                  await queue.aclose()

          asyncio.run(publish())
          PY
          # A tarefa sentinela é recusada só depois que a API valida e decifra o job.
          timeout 30s bash -c '
            until docker compose -p followw-ci-coolify -f compose.coolify.yml logs --no-color api |
              grep -E "\"route\": \"/jobs\", \"status_code\": 400" > /dev/null; do
                sleep 1
            done
          '
      - if: failure()
        run: |
          docker compose logs
          docker compose -p followw-ci-coolify -f compose.coolify.yml logs
      - if: always()
        run: |
          docker compose -p followw-ci-coolify -f compose.coolify.yml down
          docker network rm coolify || true
          docker compose down -v

  deploy-oci:
    name: Publicar o preview na Oracle
    if: github.event_name == 'push'
    needs: [python, web, oci]
    runs-on: ubuntu-latest
    permissions: {}
    defaults:
      run:
        shell: bash
    steps:
      - name: Enfileirar o commit testado no Coolify
        env:
          FOLLOWW_WEBHOOK_SECRET: ${{ secrets.FOLLOWW_OCI_WEBHOOK_SECRET }}
        run: |
          latest="$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" | cut -f1)"
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo "A branch avançou. O commit mais recente tem sua própria execução."
            exit 0
          fi
          python3 - <<'PY'
          import hashlib
          import hmac
          import json
          import os
          from urllib.request import Request, urlopen

          secret = os.environ["FOLLOWW_WEBHOOK_SECRET"]
          if not secret:
              raise SystemExit("O segredo FOLLOWW_OCI_WEBHOOK_SECRET está ausente.")
          event = json.dumps({
              "ref": os.environ["GITHUB_REF"],
              "after": os.environ["GITHUB_SHA"],
              "repository": {"full_name": os.environ["GITHUB_REPOSITORY"]},
          }).encode()
          signature = hmac.new(secret.encode(), event, hashlib.sha256).hexdigest()
          request = Request(
              "https://oracle.followw.app/_ops/followw-deploy",
              data=event,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "Followw-OCI-Deploy/1.0",
                  "X-GitHub-Event": "push",
                  "X-GitHub-Delivery": os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"],
                  "X-Hub-Signature-256": "sha256=" + signature,
              },
          )
          with urlopen(request, timeout=30) as response:
              deployments = json.load(response)
          if not isinstance(deployments, list) or not any(
              item.get("status") == "success" and item.get("deployment_uuid")
              for item in deployments
          ):
              raise SystemExit("O Coolify não confirmou o enfileiramento do commit.")
          PY
      - name: Confirmar a revisão do frontend e da API
        run: |
          latest="$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" | cut -f1)"
          if [[ "$latest" != "$GITHUB_SHA" ]]; then exit 0; fi
          revision_is_ready() {
            curl --fail --silent --max-time 10 --dump-header - --output /dev/null "$1" \
              | tr -d '\r' | grep -ix "x-followw-revision: $GITHUB_SHA"
          }
          for attempt in {1..60}; do
            if revision_is_ready https://oracle.followw.app/login &&
               revision_is_ready 'https://oracle.followw.app/api/public/subjects?code=MAT0025'; then
              exit 0
            fi
            sleep 10
          done
          echo "O commit $GITHUB_SHA não foi confirmado no frontend e na API."
          exit 1
