name: Generate PlantUML Diagrams

on:
  push:
    paths:
      - 'docs/diagrams/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Gerar Diagramas PlantUML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Gerar SVGs via PlantUML
        run: |
          curl -sSL -o plantuml.jar https://github.com/plantuml/plantuml/releases/download/v1.2024.7/plantuml-1.2024.7.jar
          java -jar plantuml.jar -tsvg docs/diagrams/*.puml -o ../assets/

      - name: Commit rendered diagrams
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs(diagrams): regenerate architecture SVGs from C4-PlantUML"
