[project]
name = "followw"
version = "0.0.1"
description = "O Followw é uma nova forma de usar o SIGAA UnB."
requires-python = ">=3.14"
dependencies = ["api", "unb-browser"]

[tool.uv]
package = false

[tool.uv.sources]
api = { workspace = true }
unb-browser = { workspace = true }

[tool.uv.workspace]
members = ["apps/api", "packages/sigaa-client", "packages/unb-browser"]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0", "ruff>=0.16.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps", "packages"]
# `apps/api/tests/test_auth.py` e `packages/sigaa-client/tests/test_auth.py`
# viram o mesmo módulo `test_auth` no modo de import padrão.
addopts = ["--import-mode=importlib"]

