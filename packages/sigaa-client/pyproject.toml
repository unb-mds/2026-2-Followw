[project]
name = "sigaa-client"
description = "Cliente Python para o SIGAA da UnB (dados públicos e autenticados)."
version = "0.0.1"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pypdf[image]>=6.19.0",
    "zxing-cpp>=3.1.1",
    "markdownify>=1.2.3",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.format]
line-ending = "lf"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
