x-api: &api
  image: followw-coolify-api
  build:
    context: ../..
    dockerfile: deploy/oci/Dockerfile
    target: api
  environment: &api-env
    ENVIRONMENT: production
    JWT_SECRET_KEY: ${JWT_SECRET_KEY:?defina JWT_SECRET_KEY}
    OAUTH_SECRET_KEY: ${OAUTH_SECRET_KEY:?defina OAUTH_SECRET_KEY}
    RATE_LIMIT_SECRET_KEY: ${RATE_LIMIT_SECRET_KEY:?defina RATE_LIMIT_SECRET_KEY}
    RATE_LIMIT_LOGIN_REQUESTS: ${RATE_LIMIT_LOGIN_REQUESTS:-30}
    PUBLIC_URL: https://oracle.followw.app/api
    CORS_ORIGINS: '["https://oracle.followw.app"]'
    QSTASH_URL: http://qstash:8080
    QSTASH_JOBS_URL: http://followw-coolify-jobs:8000/jobs
    QSTASH_TOKEN: ${QSTASH_TOKEN:?defina QSTASH_TOKEN}
    QSTASH_CURRENT_SIGNING_KEY: ${QSTASH_CURRENT_SIGNING_KEY:?defina QSTASH_CURRENT_SIGNING_KEY}
    QSTASH_NEXT_SIGNING_KEY: ${QSTASH_NEXT_SIGNING_KEY:?defina QSTASH_NEXT_SIGNING_KEY}
    UPSTASH_REDIS_REST_URL: http://redis-http
    UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:?defina UPSTASH_REDIS_REST_TOKEN}
    REDIS_STANDARD_LUA: 'true'
  logging:
    driver: local

services:
  db-init:
    <<: *api
    command: [db-init]
    environment:
      <<: *api-env
      DATABASE_URL: postgresql+asyncpg://followw:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@db/followw
    networks: [backend]

  api:
    <<: *api
    restart: unless-stopped
    environment:
      <<: *api-env
      DATABASE_URL: postgresql+asyncpg://followw_app:${POSTGRES_APP_PASSWORD:?defina POSTGRES_APP_PASSWORD}@db/followw
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - 'import urllib.request as u; u.urlopen(u.Request("http://127.0.0.1:8000/public/subjects?code=MAT0025", headers={"X-Forwarded-Proto": "https"}), timeout=4).close()'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      default:
        aliases: [followw-coolify-backend]
      backend:
        aliases: [followw-coolify-jobs]
      coolify: {}
    labels:
      - 'traefik.enable=${FOLLOWW_COOLIFY_ROUTE:-false}'
      - 'traefik.docker.network=coolify'
      - 'traefik.http.routers.followw-coolify-api.rule=Host(`oracle.followw.app`) && PathPrefix(`/api/`)'
      - 'traefik.http.routers.followw-coolify-api.priority=200'
      - 'traefik.http.routers.followw-coolify-api.entrypoints=https'
      - 'traefik.http.routers.followw-coolify-api.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.followw-coolify-api.service=followw-coolify-api'
      - 'traefik.http.routers.followw-coolify-api.middlewares=followw-coolify-api-headers,followw-coolify-api-compress,followw-coolify-prefix,followw-coolify-size'
      - 'traefik.http.services.followw-coolify-api.loadbalancer.server.port=8000'
      - 'traefik.http.services.followw-coolify-api.loadbalancer.server.scheme=h2c'
      - 'traefik.http.middlewares.followw-coolify-api-headers.headers.customresponseheaders.X-Robots-Tag=noindex'
      - 'traefik.http.middlewares.followw-coolify-api-headers.headers.customresponseheaders.X-Followw-Revision=${SOURCE_COMMIT:-unknown}'
      - 'traefik.http.middlewares.followw-coolify-api-compress.compress.includedcontenttypes=application/json,text/html,text/plain'
      - 'traefik.http.middlewares.followw-coolify-prefix.stripprefix.prefixes=/api'
      - 'traefik.http.middlewares.followw-coolify-size.buffering.maxrequestbodybytes=4500000'

  web:
    build:
      context: ../..
      dockerfile: deploy/oci/Dockerfile
      target: web
      args:
        VITE_POSTHOG_KEY: ${VITE_POSTHOG_KEY:-}
        VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-https://us.i.posthog.com}
    restart: unless-stopped
    logging:
      driver: local
    environment:
      FOLLOWW_SSR_API_ORIGIN: http://followw-coolify-backend:8000
      FOLLOWW_TRUST_PROXY: '1'
      RATE_LIMIT_SECRET_KEY: ${RATE_LIMIT_SECRET_KEY:?defina RATE_LIMIT_SECRET_KEY}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const client = require('node:http2').connect('http://127.0.0.1:3000');
          const req = client.request({ ':path': '/login' });
          const fail = () => process.exit(1);
          client.on('error', fail);
          req.on('error', fail);
          req.on('response', headers => { if (headers[':status'] !== 200) fail(); });
          req.on('end', () => client.close());
          req.resume();
          req.end();
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [default, coolify]
    labels:
      - 'traefik.enable=${FOLLOWW_COOLIFY_ROUTE:-false}'
      - 'traefik.docker.network=coolify'
      - 'traefik.http.routers.followw-coolify-web.rule=Host(`oracle.followw.app`)'
      - 'traefik.http.routers.followw-coolify-web.priority=60'
      - 'traefik.http.routers.followw-coolify-web.entrypoints=https'
      - 'traefik.http.routers.followw-coolify-web.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.followw-coolify-web.service=followw-coolify-web'
      - 'traefik.http.routers.followw-coolify-web.middlewares=followw-coolify-web-headers,followw-coolify-web-compress'
      - 'traefik.http.services.followw-coolify-web.loadbalancer.server.port=3000'
      - 'traefik.http.services.followw-coolify-web.loadbalancer.server.scheme=h2c'
      - 'traefik.http.middlewares.followw-coolify-web-headers.headers.customresponseheaders.X-Robots-Tag=noindex'
      - 'traefik.http.middlewares.followw-coolify-web-headers.headers.customresponseheaders.X-Followw-Revision=${SOURCE_COMMIT:-unknown}'
      - 'traefik.http.middlewares.followw-coolify-web-compress.compress.includedcontenttypes=text/html,text/css,text/javascript,application/javascript,application/json,application/manifest+json,image/svg+xml,text/plain'
      - 'traefik.http.routers.followw-coolify-redirect.rule=Host(`oracle.followw.app`)'
      - 'traefik.http.routers.followw-coolify-redirect.priority=60'
      - 'traefik.http.routers.followw-coolify-redirect.entrypoints=http'
      - 'traefik.http.routers.followw-coolify-redirect.service=followw-coolify-web'
      - 'traefik.http.routers.followw-coolify-redirect.middlewares=followw-coolify-https'
      - 'traefik.http.middlewares.followw-coolify-https.redirectscheme.scheme=https'
      - 'traefik.http.middlewares.followw-coolify-https.redirectscheme.permanent=true'

networks:
  backend:
    external: true
    name: followw-preview_default
  coolify:
    external: true
